<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر دورو للجملة — أسعار جملة على باقات الورد</title>
<meta name="description" content="متجر الجملة لدورو — أسعار خاصة للتجار وأصحاب المحلات">
<link rel="icon" href="/images/drrose-logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jomla/jomla.css">
</head>
<body>
<header class="store-header">
  <a href="/jomla" class="store-logo"><img src="/images/drrose-logo-small.png" alt="دورو"></a>
  <a href="/jomla/cart.html" class="cart-link">السلة <span id="cart-count">🛒</span></a>
</header>

<div id="category-view">
  <main class="category-grid" id="category-grid">
    <div class="empty-state">جاري التحميل...</div>
  </main>
</div>

<div id="products-view" style="display:none">
  <a href="#" class="category-back" id="back-link">→ كل التصنيفات</a>
  <h2 id="products-title" style="text-align:center;margin:10px 0 0"></h2>
  <main class="product-grid" id="product-grid"></main>
</div>

<script>
const API = '';
let allCategories = [];

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadCategories() {
  const grid = document.getElementById('category-grid');
  try {
    const res = await fetch(API + '/jomla/api/categories');
    allCategories = await res.json();
    if (!allCategories.length) {
      grid.innerHTML = '<div class="empty-state">لا توجد تصنيفات حالياً</div>';
      return;
    }
    grid.innerHTML = allCategories.map(c => `
      <a href="#${encodeURIComponent(c.slug)}" class="category-card" data-slug="${escapeHtml(c.slug)}">
        <img class="thumb" loading="lazy"
             src="${c.image_id ? '/jomla/product-image/' + c.image_id : ''}"
             alt="${escapeHtml(c.name)}"
             onerror="this.style.background='#fce4ec'">
        <div class="name">${escapeHtml(c.name)}</div>
      </a>
    `).join('');
    grid.querySelectorAll('.category-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        openCategory(card.dataset.slug);
      });
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">تعذر تحميل التصنيفات</div>';
  }
}

function openCategory(slug) {
  const cat = allCategories.find(c => c.slug === slug);
  document.getElementById('category-view').style.display = 'none';
  document.getElementById('products-view').style.display = '';
  document.getElementById('products-title').textContent = cat ? cat.name : '';
  location.hash = encodeURIComponent(slug);
  loadProducts(slug);
}

function closeCategory() {
  document.getElementById('products-view').style.display = 'none';
  document.getElementById('category-view').style.display = '';
  history.replaceState(null, '', location.pathname);
}

document.getElementById('back-link').addEventListener('click', (e) => {
  e.preventDefault();
  closeCategory();
});

async function loadProducts(categorySlug) {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '<div class="empty-state">جاري التحميل...</div>';
  try {
    let url = API + '/jomla/api/products';
    if (categorySlug) url += '?category=' + encodeURIComponent(categorySlug);
    const res = await fetch(url);
    const data = await res.json();
    const products = data.products || [];
    if (!products.length) {
      grid.innerHTML = '<div class="empty-state">لا توجد منتجات حالياً</div>';
      return;
    }
    grid.innerHTML = products.map(p => {
      const hasDiscount = p.compare_at_price && Number(p.compare_at_price) > Number(p.price);
      const discountPct = hasDiscount ? Math.round(100 - (Number(p.price) / Number(p.compare_at_price)) * 100) : 0;
      return `
      <div class="product-card">
        <div class="thumb-wrap">
          <a href="/jomla/product/${encodeURIComponent(p.slug)}">
            <img class="thumb" loading="lazy"
                 src="${p.image_id ? '/jomla/product-image/' + p.image_id : ''}"
                 alt="${escapeHtml(p.name)}"
                 onerror="this.style.background='#fce4ec'">
          </a>
          ${hasDiscount ? `<span class="discount-badge">${discountPct}%-</span>` : ''}
          <button class="btn-add-fab" data-id="${p.id}" aria-label="أضف إلى السلة">+</button>
        </div>
        <div class="body">
          <a href="/jomla/product/${encodeURIComponent(p.slug)}" style="text-decoration:none">
            <p class="name">${escapeHtml(p.name)}</p>
          </a>
          <div class="price-row">
            <span class="price ${hasDiscount ? 'on-sale' : ''}">${p.price} ${escapeHtml(p.currency || 'SAR')}</span>
            ${hasDiscount ? `<span class="price-compare">${p.compare_at_price} ${escapeHtml(p.currency || 'SAR')}</span>` : ''}
          </div>
          ${p.stock_note ? `<span class="stock-note">${escapeHtml(p.stock_note)}</span>` : ''}
        </div>
      </div>
    `;
    }).join('');

    grid.querySelectorAll('.btn-add-fab').forEach(btn => {
      btn.addEventListener('click', () => addToCart(btn.dataset.id, btn));
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">تعذر تحميل المنتجات</div>';
  }
}

async function addToCart(productId, btnEl) {
  const original = btnEl.textContent;
  btnEl.disabled = true;
  try {
    await fetch(API + '/jomla/api/cart/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ productId: Number(productId), quantity: 1 }),
    });
    btnEl.textContent = '✓';
    setTimeout(() => { btnEl.textContent = original; btnEl.disabled = false; }, 1000);
  } catch (err) {
    btnEl.textContent = '!';
    btnEl.disabled = false;
    setTimeout(() => { btnEl.textContent = original; }, 1500);
  }
}

window.addEventListener('hashchange', () => {
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (slug) openCategory(slug); else closeCategory();
});

(async function init() {
  await loadCategories();
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (slug) openCategory(slug);
})();
</script>
</body>
</html>
