<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر دورو للجملة — أسعار جملة على باقات الورد</title>
<meta name="description" content="متجر الجملة لدورو — أسعار خاصة للتجار وأصحاب المحلات">
<link rel="icon" href="/images/drrose-logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jomla/jomla.css?v=4">
</head>
<body>
<header class="store-header">
  <a href="/jomla" class="store-logo"><img src="/images/drrose-logo-small.png" alt="دورو"></a>
  <a href="/jomla/cart.html" class="cart-link">السلة <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></a>
</header>

<div id="category-view">
  <div class="skeleton-banner" id="banner-skeleton"></div>
  <div class="banner-slider" id="banner-slider" style="display:none"></div>
  <nav class="breadcrumb"><span class="current">الرئيسية</span></nav>
  <main class="category-grid" id="category-grid"></main>
</div>

<div id="products-view" style="display:none">
  <nav class="breadcrumb">
    <a href="#" id="breadcrumb-home">الرئيسية</a>
    <span class="sep"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></span>
    <span class="current" id="breadcrumb-current"></span>
  </nav>
  <main class="product-grid" id="product-grid"></main>
</div>

<footer class="store-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img class="footer-logo" src="/images/drrose-logo-small.png" alt="دورو">
      <p class="footer-tagline" id="footer-tagline">أسعار جملة على باقات الورد للتجار وأصحاب المحلات</p>
      <div class="footer-social" id="footer-social"></div>
    </div>
    <div class="footer-col">
      <h4>تواصل معنا</h4>
      <ul id="footer-contact"></ul>
    </div>
    <div class="footer-col">
      <h4>روابط</h4>
      <ul>
        <li><a href="/jomla">متجر الجملة</a></li>
        <li><a href="/jomla/cart.html">السلة</a></li>
        <li><a href="/jomla/terms.html">الشروط والأحكام</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">© <span id="footer-year"></span> دورو. جميع الحقوق محفوظة.</div>
</footer>

<script>
const API = '';
let allCategories = [];
const ALL_SLUG = '__all__';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function skeletonCards(n) {
  return Array.from({ length: n }).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
    </div>
  `).join('');
}

async function loadBanner() {
  const skeleton = document.getElementById('banner-skeleton');
  const slider = document.getElementById('banner-slider');
  try {
    const res = await fetch(API + '/jomla/api/products');
    const data = await res.json();
    const images = (data.products || []).filter(p => p.image_id).slice(0, 6);
    skeleton.style.display = 'none';
    if (!images.length) { return; }
    slider.style.display = '';
    slider.innerHTML = images.map((p, i) => `
      <img class="slide ${i === 0 ? 'active' : ''}" src="/jomla/product-image/${p.image_id}" alt="${escapeHtml(p.name)}">
    `).join('');
    if (images.length > 1) {
      let idx = 0;
      setInterval(() => {
        const slides = slider.querySelectorAll('.slide');
        slides[idx].classList.remove('active');
        idx = (idx + 1) % slides.length;
        slides[idx].classList.add('active');
      }, 3500);
    }
  } catch (err) { skeleton.style.display = 'none'; }
}

async function loadCategories() {
  const grid = document.getElementById('category-grid');
  grid.innerHTML = skeletonCards(5);
  try {
    const [catRes, prodRes] = await Promise.all([
      fetch(API + '/jomla/api/categories'),
      fetch(API + '/jomla/api/products'),
    ]);
    allCategories = await catRes.json();
    const prodData = await prodRes.json();
    const allProductsImageId = (prodData.products || []).find(p => p.image_id)?.image_id;
    const cards = [
      `<a href="#${ALL_SLUG}" class="category-card" data-slug="${ALL_SLUG}">
        <img class="thumb" loading="lazy"
             src="${allProductsImageId ? '/jomla/product-image/' + allProductsImageId : ''}"
             alt="كل المنتجات" onerror="this.style.background='#fce4ec'">
        <div class="name">كل المنتجات</div>
      </a>`,
      ...allCategories.map(c => `
      <a href="#${encodeURIComponent(c.slug)}" class="category-card" data-slug="${escapeHtml(c.slug)}">
        <img class="thumb" loading="lazy"
             src="${c.image_id ? '/jomla/product-image/' + c.image_id : ''}"
             alt="${escapeHtml(c.name)}"
             onerror="this.style.background='#fce4ec'">
        <div class="name">${escapeHtml(c.name)}</div>
      </a>`)
    ];
    grid.innerHTML = cards.join('');
    grid.querySelectorAll('.category-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        openCategory(card.dataset.slug);
      });
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">تعذر تحميل التصنيفات</div>';
  }
}

function openCategory(slug) {
  const cat = allCategories.find(c => c.slug === slug);
  document.getElementById('category-view').style.display = 'none';
  document.getElementById('products-view').style.display = '';
  document.getElementById('breadcrumb-current').textContent = slug === ALL_SLUG ? 'كل المنتجات' : (cat ? cat.name : '');
  location.hash = encodeURIComponent(slug);
  loadProducts(slug === ALL_SLUG ? null : slug);
}

function closeCategory() {
  document.getElementById('products-view').style.display = 'none';
  document.getElementById('category-view').style.display = '';
  history.replaceState(null, '', location.pathname);
}

document.getElementById('breadcrumb-home').addEventListener('click', (e) => {
  e.preventDefault();
  closeCategory();
});

async function loadProducts(categorySlug) {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = skeletonCards(6);
  try {
    let url = API + '/jomla/api/products';
    if (categorySlug) url += '?category=' + encodeURIComponent(categorySlug);
    const res = await fetch(url);
    const data = await res.json();
    const products = data.products || [];
    if (!products.length) {
      grid.innerHTML = '<div class="empty-state">لا توجد منتجات حالياً</div>';
      return;
    }
    grid.innerHTML = products.map(p => {
      const hasDiscount = p.compare_at_price && Number(p.compare_at_price) > Number(p.price);
      const discountPct = hasDiscount ? Math.round(100 - (Number(p.price) / Number(p.compare_at_price)) * 100) : 0;
      return `
      <div class="product-card">
        <div class="thumb-wrap">
          <a href="/jomla/product/${encodeURIComponent(p.slug)}">
            <img class="thumb" loading="lazy"
                 src="${p.image_id ? '/jomla/product-image/' + p.image_id : ''}"
                 alt="${escapeHtml(p.name)}"
                 onerror="this.style.background='#fce4ec'">
          </a>
          ${hasDiscount ? `<span class="discount-badge">${discountPct}%-</span>` : ''}
          <button class="btn-add-fab" data-id="${p.id}" aria-label="أضف إلى السلة">+</button>
        </div>
        <div class="body">
          <a href="/jomla/product/${encodeURIComponent(p.slug)}" style="text-decoration:none">
            <p class="name">${escapeHtml(p.name)}</p>
          </a>
          <div class="price-row">
            <span class="price ${hasDiscount ? 'on-sale' : ''}">${p.price} ${escapeHtml(p.currency || 'SAR')}</span>
            ${hasDiscount ? `<span class="price-compare">${p.compare_at_price} ${escapeHtml(p.currency || 'SAR')}</span>` : ''}
          </div>
          ${p.stock_note ? `<span class="stock-note">${escapeHtml(p.stock_note)}</span>` : ''}
        </div>
      </div>
    `;
    }).join('');

    grid.querySelectorAll('.btn-add-fab').forEach(btn => {
      btn.addEventListener('click', () => addToCart(btn.dataset.id, btn));
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">تعذر تحميل المنتجات</div>';
  }
}

async function addToCart(productId, btnEl) {
  const original = btnEl.textContent;
  btnEl.disabled = true;
  try {
    await fetch(API + '/jomla/api/cart/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ productId: Number(productId), quantity: 1 }),
    });
    btnEl.textContent = '✓';
    setTimeout(() => { btnEl.textContent = original; btnEl.disabled = false; }, 1000);
  } catch (err) {
    btnEl.textContent = '!';
    btnEl.disabled = false;
    setTimeout(() => { btnEl.textContent = original; }, 1500);
  }
}

window.addEventListener('hashchange', () => {
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (slug) openCategory(slug); else closeCategory();
});

async function loadFooter() {
  try {
    const res = await fetch(API + '/jomla/api/site-info');
    const s = await res.json();
    if (s.tagline) document.getElementById('footer-tagline').textContent = s.tagline;

    const contact = document.getElementById('footer-contact');
    const items = [];
    if (s.phone) items.push(`<li><a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a></li>`);
    if (s.whatsapp) {
      let digits = s.whatsapp.replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '966' + digits.slice(1);
      items.push(`<li><a href="https://wa.me/${digits}" target="_blank" rel="noopener">واتساب</a></li>`);
    }
    contact.innerHTML = items.join('') || '<li>—</li>';

    const social = document.getElementById('footer-social');
    if (s.instagram) {
      const handle = s.instagram.replace(/^@/, '');
      social.innerHTML = `<a href="https://instagram.com/${handle}" target="_blank" rel="noopener" aria-label="إنستقرام"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>`;
    }
  } catch (err) { /* الفوتر يبقى بدون بيانات تواصل إذا فشل التحميل */ }
}

(async function init() {
  loadBanner();
  loadFooter();
  document.getElementById('footer-year').textContent = new Date().getFullYear();
  await loadCategories();
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (slug) openCategory(slug);
})();
</script>
</body>
</html>
