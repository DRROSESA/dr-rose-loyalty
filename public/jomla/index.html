<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجر د. روز للجملة — أسعار جملة على باقات الورد</title>
<meta name="description" content="متجر الجملة لد. روز — أسعار خاصة للتجار وأصحاب المحلات">
<link rel="icon" href="/images/drrose-logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jomla/jomla.css?v=7">
</head>
<body>
<header class="store-header">
  <div class="header-start">
    <button class="menu-toggle" id="menu-toggle" aria-label="القائمة"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
    <a href="/jomla" class="store-logo"><img src="/images/drrose-logo-small.png" alt="د. روز للورد"></a>
  </div>
  <a href="/jomla/cart.html" class="cart-link">السلة <span class="cart-badge" id="cart-badge" style="display:none">0</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></a>
</header>

<div class="side-menu-overlay" id="side-menu-overlay"></div>
<div class="side-menu" id="side-menu">
  <button class="close-menu" id="close-menu" aria-label="إغلاق">✕</button>
  <nav>
    <a href="/jomla">الرئيسية</a>
    <a href="/jomla/cart.html">السلة</a>
    <a href="/jomla/terms.html">الشروط والأحكام</a>
  </nav>
</div>

<div id="category-view">
  <div class="skeleton-banner" id="banner-skeleton"></div>
  <div class="banner-slider" id="banner-slider" style="display:none"></div>
  <nav class="breadcrumb"><span class="current">الرئيسية</span></nav>
  <main class="category-grid" id="category-grid"></main>
</div>

<div id="products-view" style="display:none">
  <nav class="breadcrumb">
    <a href="#" id="breadcrumb-home">الرئيسية</a>
    <span class="sep"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></span>
    <span class="current" id="breadcrumb-current"></span>
  </nav>
  <main class="product-grid" id="product-grid"></main>
</div>

<footer class="store-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img class="footer-logo" id="footer-logo" src="/images/drrose-logo-small.png" alt="د. روز للورد">
      <p class="footer-tagline" id="footer-tagline">أسعار جملة على باقات الورد للتجار وأصحاب المحلات</p>
      <div class="footer-social" id="footer-social"></div>
    </div>
    <div class="footer-col">
      <h4>تواصل معنا</h4>
      <ul id="footer-contact"></ul>
    </div>
    <div class="footer-col">
      <h4>روابط</h4>
      <ul>
        <li><a href="/jomla">متجر الجملة</a></li>
        <li><a href="/jomla/cart.html">السلة</a></li>
        <li><a href="/jomla/terms.html">الشروط والأحكام</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">© <span id="footer-year"></span> <span id="footer-name">د. روز للورد</span>. جميع الحقوق محفوظة.<br><a href="https://komailsalman.com" target="_blank" rel="noopener" class="footer-credit">تصميم وتنفيذ كميل سلمان</a></div>
</footer>

<script>
const API = '';
let allCategories = [];
const ALL_SLUG = '__all__';

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function skeletonCards(n) {
  return Array.from({ length: n }).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-line"></div>
      <div class="skeleton-line short"></div>
    </div>
  `).join('');
}

async function loadBanner() {
  const skeleton = document.getElementById('banner-skeleton');
  const slider = document.getElementById('banner-slider');
  try {
    const res = await fetch(API + '/jomla/api/products');
    const data = await res.json();
    const images = (data.products || []).filter(p => p.image_id).slice(0, 6);
    skeleton.style.display = 'none';
    if (!images.length) { return; }
    slider.style.display = '';
    slider.innerHTML = images.map((p, i) => `
      <img class="slide ${i === 0 ? 'active' : ''}" src="/jomla/product-image/${p.image_id}" alt="${escapeHtml(p.name)}">
    `).join('');
    if (images.length > 1) {
      let idx = 0;
      setInterval(() => {
        const slides = slider.querySelectorAll('.slide');
        slides[idx].classList.remove('active');
        idx = (idx + 1) % slides.length;
        slides[idx].classList.add('active');
      }, 3500);
    }
  } catch (err) { skeleton.style.display = 'none'; }
}

async function loadCategories() {
  const grid = document.getElementById('category-grid');
  grid.innerHTML = skeletonCards(5);
  try {
    const [catRes, prodRes] = await Promise.all([
      fetch(API + '/jomla/api/categories'),
      fetch(API + '/jomla/api/products'),
    ]);
    allCategories = await catRes.json();
    const prodData = await prodRes.json();
    const allProductsImageId = (prodData.products || []).find(p => p.image_id)?.image_id;
    const cards = [
      `<a href="#${ALL_SLUG}" class="category-card" data-slug="${ALL_SLUG}">
        <img class="thumb" loading="lazy"
             src="${allProductsImageId ? '/jomla/product-image/' + allProductsImageId : ''}"
             alt="كل المنتجات" onerror="this.style.background='#fce4ec'">
        <div class="name">كل المنتجات</div>
      </a>`,
      ...allCategories.map(c => `
      <a href="#${encodeURIComponent(c.slug)}" class="category-card" data-slug="${escapeHtml(c.slug)}">
        <img class="thumb" loading="lazy"
             src="${c.image_id ? '/jomla/product-image/' + c.image_id : ''}"
             alt="${escapeHtml(c.name)}"
             onerror="this.style.background='#fce4ec'">
        <div class="name">${escapeHtml(c.name)}</div>
      </a>`)
    ];
    grid.innerHTML = cards.join('');
    grid.querySelectorAll('.category-card').forEach(card => {
      card.addEventListener('click', (e) => {
        e.preventDefault();
        openCategory(card.dataset.slug);
      });
    });
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">تعذر تحميل التصنيفات</div>';
  }
}

function openCategory(slug) {
  const cat = allCategories.find(c => c.slug === slug);
  document.getElementById('category-view').style.display = 'none';
  document.getElementById('products-view').style.display = '';
  document.getElementById('breadcrumb-current').textContent = slug === ALL_SLUG ? 'كل المنتجات' : (cat ? cat.name : '');
  location.hash = encodeURIComponent(slug);
  loadProducts(slug === ALL_SLUG ? null : slug);
}

function closeCategory() {
  document.getElementById('products-view').style.display = 'none';
  document.getElementById('category-view').style.display = '';
  history.replaceState(null, '', location.pathname);
}

document.getElementById('breadcrumb-home').addEventListener('click', (e) => {
  e.preventDefault();
  closeCategory();
});

async function loadProducts(categorySlug) {
  const grid = document.getElementById('product-grid');
  grid.innerHTML = skeletonCards(6);
  try {
    let url = API + '/jomla/api/products';
    if (categorySlug) url += '?category=' + encodeURIComponent(categorySlug);
    const res = await fetch(url);
    const data = await res.json();
    const products = data.products || [];
    if (!products.length) {
      grid.innerHTML = '<div class="empty-state">لا توجد منتجات حالياً</div>';
      return;
    }
    grid.innerHTML = products.map(p => {
      const hasDiscount = p.compare_at_price && Number(p.compare_at_price) > Number(p.price);
      const discountPct = hasDiscount ? Math.round(100 - (Number(p.price) / Number(p.compare_at_price)) * 100) : 0;
      return `
      <div class="product-card" data-product-id="${p.id}">
        <div class="thumb-wrap">
          <a href="/jomla/product/${encodeURIComponent(p.slug)}">
            <img class="thumb" loading="lazy"
                 src="${p.image_id ? '/jomla/product-image/' + p.image_id : ''}"
                 alt="${escapeHtml(p.name)}"
                 onerror="this.style.background='#fce4ec'">
          </a>
          ${hasDiscount ? `<span class="discount-badge">${discountPct}%-</span>` : ''}
          <div class="cart-control" data-id="${p.id}"></div>
        </div>
        <div class="body">
          <a href="/jomla/product/${encodeURIComponent(p.slug)}" style="text-decoration:none">
            <p class="name">${escapeHtml(p.name)}</p>
          </a>
          <div class="price-row">
            <span class="price ${hasDiscount ? 'on-sale' : ''}">${p.price} ${escapeHtml(p.currency || 'SAR')}</span>
            ${hasDiscount ? `<span class="price-compare">${p.compare_at_price} ${escapeHtml(p.currency || 'SAR')}</span>` : ''}
          </div>
          ${p.stock_note ? `<span class="stock-note">${escapeHtml(p.stock_note)}</span>` : ''}
        </div>
      </div>
    `;
    }).join('');

    renderCartControls();
  } catch (err) {
    grid.innerHTML = '<div class="empty-state">تعذر تحميل المنتجات</div>';
  }
}

function cartControlHtml(productId, qty) {
  if (!qty) return `<button class="btn-add-fab" data-id="${productId}" aria-label="أضف إلى السلة">+</button>`;
  return `
    <div class="qty-stepper" data-id="${productId}">
      <button class="qty-minus" aria-label="إنقاص">−</button>
      <span class="qty-value">${qty}</span>
      <button class="qty-plus" aria-label="زيادة">+</button>
    </div>`;
}

function renderCartControls() {
  document.querySelectorAll('.cart-control').forEach(el => {
    const id = el.dataset.id;
    el.innerHTML = cartControlHtml(id, cartQuantities[id] || 0);
  });
  document.querySelectorAll('.btn-add-fab').forEach(btn => {
    btn.addEventListener('click', () => changeCartQty(btn.dataset.id, 1));
  });
  document.querySelectorAll('.qty-plus').forEach(btn => {
    btn.addEventListener('click', () => changeCartQty(btn.closest('.qty-stepper').dataset.id, 1));
  });
  document.querySelectorAll('.qty-minus').forEach(btn => {
    btn.addEventListener('click', () => changeCartQty(btn.closest('.qty-stepper').dataset.id, -1));
  });
}

async function changeCartQty(productId, delta) {
  const id = String(productId);
  const current = cartQuantities[id] || 0;
  const next = Math.max(0, current + delta);
  cartQuantities[id] = next;
  renderCartControls();
  updateCartBadge();
  try {
    if (current === 0 && next === 1) {
      await fetch(API + '/jomla/api/cart/add', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ productId: Number(id), quantity: 1 }),
      });
    } else {
      await fetch(API + '/jomla/api/cart/update', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ productId: Number(id), quantity: next }),
      });
    }
  } catch (err) { /* تبقى الكمية كما هي محلياً حتى لو فشل الطلب */ }
}

let cartQuantities = {};

async function loadCartState() {
  try {
    const res = await fetch(API + '/jomla/api/cart', { credentials: 'include' });
    const data = await res.json();
    cartQuantities = {};
    (data.items || []).forEach(i => { cartQuantities[String(i.product_id)] = i.quantity; });
    renderCartControls();
    updateCartBadge();
  } catch (err) { /* السلة تبقى فارغة إذا فشل التحميل */ }
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  if (!badge) return;
  const total = Object.values(cartQuantities).reduce((sum, q) => sum + q, 0);
  if (total > 0) { badge.textContent = total; badge.style.display = ''; }
  else { badge.style.display = 'none'; }
}

window.addEventListener('hashchange', () => {
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (slug) openCategory(slug); else closeCategory();
});

async function loadFooter() {
  try {
    const res = await fetch(API + '/jomla/api/site-info');
    const s = await res.json();
    if (s.tagline) document.getElementById('footer-tagline').textContent = s.tagline;
    if (s.store_name) {
      document.getElementById('footer-logo').alt = s.store_name;
      document.getElementById('footer-name').textContent = s.store_name;
    }

    const contact = document.getElementById('footer-contact');
    const items = [];
    if (s.phone) items.push(`<li><a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a></li>`);
    if (s.whatsapp) {
      let digits = s.whatsapp.replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '966' + digits.slice(1);
      items.push(`<li><a href="https://wa.me/${digits}" target="_blank" rel="noopener">واتساب</a></li>`);
    }
    contact.innerHTML = items.join('') || '<li>—</li>';

    const social = document.getElementById('footer-social');
    const socialItems = [];
    if (s.instagram) {
      const handle = s.instagram.replace(/^@/, '');
      socialItems.push(`<a href="https://instagram.com/${handle}" target="_blank" rel="noopener" aria-label="إنستقرام"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>`);
    }
    if (s.snapchat) {
      const handle = s.snapchat.replace(/^@/, '');
      socialItems.push(`<a href="https://snapchat.com/add/${handle}" target="_blank" rel="noopener" aria-label="سناب شات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c2.8 0 5 2.2 5 5v2.3c0 .5.3 1 .8 1.4l1.3 1c.4.3.3.9-.2 1l-1.6.5c-.3.1-.5.4-.4.7.2.9.7 1.6 1.7 1.9.4.1.4.7 0 .9-.7.4-1.6.6-2.3.7-.2 0-.4.2-.4.4 0 .3-.1.7-.2 1-.1.3-.4.4-.7.3-.6-.2-1.3-.3-1.9-.1-.7.2-1.3.7-2 1.1-.6.3-1.3.3-1.9 0-.7-.4-1.3-.9-2-1.1-.6-.2-1.3-.1-1.9.1-.3.1-.6 0-.7-.3-.1-.3-.2-.7-.2-1 0-.2-.2-.4-.4-.4-.7-.1-1.6-.3-2.3-.7-.4-.2-.4-.8 0-.9 1-.3 1.5-1 1.7-1.9.1-.3-.1-.6-.4-.7l-1.6-.5c-.5-.1-.6-.7-.2-1l1.3-1c.5-.4.8-.9.8-1.4V7c0-2.8 2.2-5 5-5z"></path></svg></a>`);
    }
    social.innerHTML = socialItems.join('');
  } catch (err) { /* الفوتر يبقى بدون بيانات تواصل إذا فشل التحميل */ }
}

function initSideMenu() {
  const toggle = document.getElementById('menu-toggle');
  const overlay = document.getElementById('side-menu-overlay');
  const menu = document.getElementById('side-menu');
  const closeBtn = document.getElementById('close-menu');
  if (!toggle) return;
  const open = () => { overlay.classList.add('open'); menu.classList.add('open'); };
  const close = () => { overlay.classList.remove('open'); menu.classList.remove('open'); };
  toggle.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', close);
}

(async function init() {
  loadBanner();
  loadFooter();
  initSideMenu();
  loadCartState();
  document.getElementById('footer-year').textContent = new Date().getFullYear();
  await loadCategories();
  const slug = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (slug) openCategory(slug);
})();
</script>
</body>
</html>
