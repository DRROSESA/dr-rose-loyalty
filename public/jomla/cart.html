<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السلة — متجر الجملة</title>
<link rel="icon" href="/images/drrose-logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/jomla/jomla.css?v=6">
</head>
<body>
<header class="store-header">
  <a href="/jomla" class="store-logo"><img src="/images/drrose-logo-small.png" alt="دورو"></a>
  <a href="/jomla" class="cart-link">متابعة التسوق</a>
</header>

<main class="cart-page">
  <h1>سلة الجملة</h1>
  <div id="cart-items"><div class="empty-state">جاري التحميل...</div></div>
</main>

<footer class="store-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img class="footer-logo" src="/images/drrose-logo-small.png" alt="دورو">
      <p class="footer-tagline" id="footer-tagline">أسعار جملة على باقات الورد للتجار وأصحاب المحلات</p>
      <div class="footer-social" id="footer-social"></div>
    </div>
    <div class="footer-col">
      <h4>تواصل معنا</h4>
      <ul id="footer-contact"></ul>
    </div>
    <div class="footer-col">
      <h4>روابط</h4>
      <ul>
        <li><a href="/jomla">متجر الجملة</a></li>
        <li><a href="/jomla/cart.html">السلة</a></li>
        <li><a href="/jomla/terms.html">الشروط والأحكام</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">© <span id="footer-year"></span> دورو. جميع الحقوق محفوظة.</div>
</footer>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadCart() {
  const container = document.getElementById('cart-items');
  try {
    const res = await fetch('/jomla/api/cart', { credentials: 'include' });
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">السلة فارغة</div>';
      return;
    }
    container.innerHTML = items.map(i => `
      <div class="cart-item" data-id="${i.product_id}">
        <img src="${i.image_id ? '/jomla/product-image/' + i.image_id : ''}" alt="${escapeHtml(i.name)}">
        <div class="name">${escapeHtml(i.name)}</div>
        <div class="qty-controls">
          <button class="qty-minus">−</button>
          <span class="qty">${i.quantity}</span>
          <button class="qty-plus">+</button>
        </div>
        <div class="line-price">${(i.price * i.quantity).toFixed(2)} ${escapeHtml(data.currency || 'SAR')}</div>
      </div>
    `).join('') + `<div class="cart-total"><span>الإجمالي</span><span>${data.total.toFixed(2)} SAR</span></div>`;

    container.querySelectorAll('.cart-item').forEach(row => {
      const id = row.dataset.id;
      const qtyEl = row.querySelector('.qty');
      row.querySelector('.qty-plus').onclick = () => updateQty(id, parseInt(qtyEl.textContent) + 1);
      row.querySelector('.qty-minus').onclick = () => updateQty(id, parseInt(qtyEl.textContent) - 1);
    });
  } catch (err) {
    container.innerHTML = '<div class="empty-state">تعذر تحميل السلة</div>';
  }
}

async function updateQty(productId, quantity) {
  await fetch('/jomla/api/cart/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ productId: Number(productId), quantity }),
  });
  loadCart();
}

async function loadFooter() {
  try {
    const res = await fetch('/jomla/api/site-info');
    const s = await res.json();
    if (s.tagline) document.getElementById('footer-tagline').textContent = s.tagline;

    const contact = document.getElementById('footer-contact');
    const items = [];
    if (s.phone) items.push(`<li><a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a></li>`);
    if (s.whatsapp) {
      let digits = s.whatsapp.replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '966' + digits.slice(1);
      items.push(`<li><a href="https://wa.me/${digits}" target="_blank" rel="noopener">واتساب</a></li>`);
    }
    contact.innerHTML = items.join('') || '<li>—</li>';

    const social = document.getElementById('footer-social');
    if (s.instagram) {
      const handle = s.instagram.replace(/^@/, '');
      social.innerHTML = `<a href="https://instagram.com/${handle}" target="_blank" rel="noopener" aria-label="إنستقرام"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>`;
    }
  } catch (err) { /* الفوتر يبقى بدون بيانات تواصل إذا فشل التحميل */ }
}

loadCart();
loadFooter();
document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
