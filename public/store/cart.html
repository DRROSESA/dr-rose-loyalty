<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>السلة — متجر د. روز</title>
<link rel="icon" href="/images/drrose-logo-small.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/store/store.css?v=7">
</head>
<body>
<header class="store-header">
  <div class="header-start">
    <button class="menu-toggle" id="menu-toggle" aria-label="القائمة"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
    <a href="/store" class="store-logo"><img src="/images/drrose-logo-small.png" alt="د. روز للورد"></a>
  </div>
  <a href="/store" class="cart-link">متابعة التسوق</a>
</header>

<div class="side-menu-overlay" id="side-menu-overlay"></div>
<div class="side-menu" id="side-menu">
  <button class="close-menu" id="close-menu" aria-label="إغلاق">✕</button>
  <nav>
    <a href="/store">الرئيسية</a>
    <a href="/store/cart.html">السلة</a>
    <a href="/store/terms.html">الشروط والأحكام</a>
  </nav>
</div>

<main class="cart-page">
  <h1>سلة المشتريات</h1>
  <div id="cart-items"><div class="empty-state">جاري التحميل...</div></div>
</main>

<footer class="store-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <img class="footer-logo" id="footer-logo" src="/images/drrose-logo-small.png" alt="د. روز للورد">
      <p class="footer-tagline" id="footer-tagline">باقات ورد فاخرة توصلك بسرعة</p>
      <div class="footer-social" id="footer-social"></div>
    </div>
    <div class="footer-col">
      <h4>تواصل معنا</h4>
      <ul id="footer-contact"></ul>
    </div>
    <div class="footer-col">
      <h4>روابط</h4>
      <ul>
        <li><a href="/store">المتجر</a></li>
        <li><a href="/store/cart.html">السلة</a></li>
        <li><a href="/store/terms.html">الشروط والأحكام</a></li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">© <span id="footer-year"></span> <span id="footer-name">د. روز للورد</span>. جميع الحقوق محفوظة.<br><a href="https://komailsalman.com" target="_blank" rel="noopener" class="footer-credit">تصميم وتنفيذ كميل سلمان</a></div>
</footer>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function loadCart() {
  const container = document.getElementById('cart-items');
  try {
    const res = await fetch('/store/api/cart', { credentials: 'include' });
    const data = await res.json();
    const items = data.items || [];
    if (!items.length) {
      container.innerHTML = '<div class="empty-state">السلة فارغة</div>';
      return;
    }
    container.innerHTML = items.map(i => `
      <div class="cart-item" data-id="${i.product_id}">
        <img src="${i.image_id ? '/store/product-image/' + i.image_id : ''}" alt="${escapeHtml(i.name)}">
        <div class="name">${escapeHtml(i.name)}</div>
        <div class="qty-controls">
          <button class="qty-minus">−</button>
          <span class="qty">${i.quantity}</span>
          <button class="qty-plus">+</button>
        </div>
        <div class="line-price">${(i.price * i.quantity).toFixed(2)} ${escapeHtml(data.currency || 'SAR')}</div>
      </div>
    `).join('') + `<div class="cart-total"><span>الإجمالي</span><span>${data.total.toFixed(2)} SAR</span></div>`;

    container.querySelectorAll('.cart-item').forEach(row => {
      const id = row.dataset.id;
      const qtyEl = row.querySelector('.qty');
      row.querySelector('.qty-plus').onclick = () => updateQty(id, parseInt(qtyEl.textContent) + 1);
      row.querySelector('.qty-minus').onclick = () => updateQty(id, parseInt(qtyEl.textContent) - 1);
    });
  } catch (err) {
    container.innerHTML = '<div class="empty-state">تعذر تحميل السلة</div>';
  }
}

async function updateQty(productId, quantity) {
  await fetch('/store/api/cart/update', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'include',
    body: JSON.stringify({ productId: Number(productId), quantity }),
  });
  loadCart();
}

async function loadFooter() {
  try {
    const res = await fetch('/store/api/site-info');
    const s = await res.json();
    if (s.tagline) document.getElementById('footer-tagline').textContent = s.tagline;
    if (s.store_name) {
      document.getElementById('footer-logo').alt = s.store_name;
      document.getElementById('footer-name').textContent = s.store_name;
    }

    const contact = document.getElementById('footer-contact');
    const items = [];
    if (s.phone) items.push(`<li><a href="tel:${escapeHtml(s.phone)}">${escapeHtml(s.phone)}</a></li>`);
    if (s.whatsapp) {
      let digits = s.whatsapp.replace(/\D/g, '');
      if (digits.startsWith('0')) digits = '966' + digits.slice(1);
      items.push(`<li><a href="https://wa.me/${digits}" target="_blank" rel="noopener">واتساب</a></li>`);
    }
    contact.innerHTML = items.join('') || '<li>—</li>';

    const social = document.getElementById('footer-social');
    const socialItems = [];
    if (s.instagram) {
      const handle = s.instagram.replace(/^@/, '');
      socialItems.push(`<a href="https://instagram.com/${handle}" target="_blank" rel="noopener" aria-label="إنستقرام"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg></a>`);
    }
    if (s.snapchat) {
      const handle = s.snapchat.replace(/^@/, '');
      socialItems.push(`<a href="https://snapchat.com/add/${handle}" target="_blank" rel="noopener" aria-label="سناب شات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2c2.8 0 5 2.2 5 5v2.3c0 .5.3 1 .8 1.4l1.3 1c.4.3.3.9-.2 1l-1.6.5c-.3.1-.5.4-.4.7.2.9.7 1.6 1.7 1.9.4.1.4.7 0 .9-.7.4-1.6.6-2.3.7-.2 0-.4.2-.4.4 0 .3-.1.7-.2 1-.1.3-.4.4-.7.3-.6-.2-1.3-.3-1.9-.1-.7.2-1.3.7-2 1.1-.6.3-1.3.3-1.9 0-.7-.4-1.3-.9-2-1.1-.6-.2-1.3-.1-1.9.1-.3.1-.6 0-.7-.3-.1-.3-.2-.7-.2-1 0-.2-.2-.4-.4-.4-.7-.1-1.6-.3-2.3-.7-.4-.2-.4-.8 0-.9 1-.3 1.5-1 1.7-1.9.1-.3-.1-.6-.4-.7l-1.6-.5c-.5-.1-.6-.7-.2-1l1.3-1c.5-.4.8-.9.8-1.4V7c0-2.8 2.2-5 5-5z"></path></svg></a>`);
    }
    social.innerHTML = socialItems.join('');
  } catch (err) { /* الفوتر يبقى بدون بيانات تواصل إذا فشل التحميل */ }
}

function initSideMenu() {
  const toggle = document.getElementById('menu-toggle');
  const overlay = document.getElementById('side-menu-overlay');
  const menu = document.getElementById('side-menu');
  const closeBtn = document.getElementById('close-menu');
  if (!toggle) return;
  const open = () => { overlay.classList.add('open'); menu.classList.add('open'); };
  const close = () => { overlay.classList.remove('open'); menu.classList.remove('open'); };
  toggle.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  overlay.addEventListener('click', close);
}

loadCart();
loadFooter();
initSideMenu();
document.getElementById('footer-year').textContent = new Date().getFullYear();
</script>
</body>
</html>
